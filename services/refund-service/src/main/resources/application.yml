server:
  port: ${REFUND_SERVICE_PORT:8098}

spring:
  application:
    name: refund-service
  datasource:
    url: ${REFUND_DB_URL:jdbc:mysql://localhost:3306/refund_db}
    username: ${REFUND_DB_USER:bsl}
    password: ${REFUND_DB_PASSWORD:bsl}
    driver-class-name: com.mysql.cj.jdbc.Driver

refund:
  downstream:
    payment-service:
      base-url: ${PAYMENT_BASE_URL:http://localhost:8093}
      timeout-ms: ${PAYMENT_TIMEOUT_MS:700}
    inventory-service:
      base-url: ${INVENTORY_BASE_URL:http://localhost:8094}
      timeout-ms: ${INVENTORY_TIMEOUT_MS:700}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
